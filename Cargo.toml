[workspace]
members = ["crates/*", "bins/*", "sdk", "programs/*/host"]
# Each guest is its own workspace, for another target. A host depends on its guest's library by path, which
# would make the guest a member: `exclude` takes no globs, so each is named.
exclude = ["programs/leansphincs-members/guest", "programs/leanxmss/guest", "programs/leansphincs/guest", "programs/leanda/guest", "programs/falcon/guest", "programs/stateproof/guest", "programs/shielded/guest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# The leanISA crates' lints. The RISC-V crates (`flock`, `zk`, `fiat_shamir_rv`, `pcs_rv`, `leanvm_rv`, the SDK
# and the program hosts) set their own, stricter, in their manifests.
# Numeric kernels legitimately index by loop variable and take many arguments.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bench = { path = "crates/bench" }
leanvm = { path = "crates/leanvm" }
primitives = { path = "crates/primitives" }
fiat_shamir = { path = "crates/fiat_shamir" }
pcs = { path = "crates/pcs" }
keccak_gkr = { path = "crates/keccak_gkr" }
leanvm_core = { path = "crates/leanvm_core" }
lean_compiler = { path = "crates/lean_compiler" }
lean_da = { path = "crates/lean_da" }
rec_aggregation = { path = "crates/rec_aggregation" }
signatures = { path = "crates/signatures" }
parallel = { path = "crates/parallel" }
verifier = { path = "crates/verifier" }
leanvm_rv = { path = "crates/leanvm_rv" }
fiat_shamir_rv = { path = "crates/fiat_shamir_rv" }
pcs_rv = { path = "crates/pcs_rv" }
flock = { path = "crates/flock" }
zk = { path = "crates/zk" }
leanvm_guest = { path = "sdk" }
leanxmss-host = { path = "programs/leanxmss/host" }
leansphincs-host = { path = "programs/leansphincs/host" }
leanda-host = { path = "programs/leanda/host" }
falcon-host = { path = "programs/falcon/host" }
stateproof-host = { path = "programs/stateproof/host" }
shielded-host = { path = "programs/shielded/host" }
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
sha3 = "0.11"
thiserror = { version = "2", default-features = false }
tikv-jemallocator = "0.7"
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
