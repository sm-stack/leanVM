[package]
name = "pcs_rv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The RISC-V crates' lints, the same in each of their manifests.
[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[dependencies]
parallel.workspace = true
primitives.workspace = true
fiat_shamir_rv.workspace = true
tracing.workspace = true
thiserror.workspace = true
rand_core.workspace = true

[dev-dependencies]
rand_chacha.workspace = true
primitives = { workspace = true, features = ["test-util"] }
bench.workspace = true

[[bench]]
name = "throughput"
harness = false
