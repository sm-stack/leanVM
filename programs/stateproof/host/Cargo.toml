[package]
name = "stateproof-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The RISC-V crates' lints, the same in each of their manifests.
[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[dependencies]
stateproof = { path = "../guest" }
leanvm_guest.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
alloy-primitives = "1"
alloy-trie = "0.9"
leanvm_rv.workspace = true
proptest.workspace = true
